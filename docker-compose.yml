services:
  geoip-extractor:
    image: ghcr.io/shlomiporush/geoip-extractor:latest
    env_file:
      - .env
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./maxmind:/app/maxmind
      - ./output:/app/output
      - ./config:/app/config
      - ./logs:/logs/geoip
    tty: true
    cpus: '4.0'
